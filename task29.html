<!DOCTYPE html>
<html>
<head>
    <title>Text Properties</title>
    <link rel="stylesheet" type="text/css" href=Task21-30.csss">
</head>
<body>

    <h1>Text Properties</h1>
     <style>
        /* Text Transform */
        .transform {
            text-transform: uppercase;
        }

        /* Text Decoration */
        .decoration {
            text-decoration: underline;
        }

        /* Letter Spacing */
        .spacing {
            letter-spacing: 8px;
        }
    </style>

    <p class="transform">cyber securityt</p>

    <p class="decoration">software engineering</p>

    <p class="spacing">ethical hacker</p>
</body>
</html>
