<!DOCTYPE html>
<html>
<head>
    <title>Font Families</title>
</head>
<body>

     <title>Different Font Families</title>

    <style>
        .arial {
            font-family: Arial, sans-serif;
        }

        .times {
            font-family: "Times New Roman", serif;
        }

        .verdana {
            font-family: Verdana, sans-serif;
        }
    </style>
</head>

<body>

    <h1>Different Font Families</h1>

    <p class="arial">
        Application developer
    </p>

    <p class="times">
         Software engineers
    </p>

    <p class="verdana">
       defence minister
    
</body>
</html>
