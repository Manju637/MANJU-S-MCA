<!DOCTYPE html>
<html>
<head>
    <title>Background Properties</title>
</head>
<body>

    <title> Background Properties</title>

    <style>
        body {
            /* 1. Background Color */
            background-color: lightblue;

            /* 3. Background Position */
            background-position: center;

            /* 4. Background Repeat */
            background-repeat: no-repeat;

            /* 5. Background Size */
            background-size: cover;
        }

        h1 {
            text-align: center;
            color: darkblue;
            margin-top: 200px;
        }

        p {
            text-align: center;
            font-size: 20px;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Background Properties</h1>

    <p>
         I started learning new skills and improved my knowledge every day.
            I practiced programming, communication skills, and other technical
            skills. With continuous effort and confidence, I slowly improved myself.
    </p>


</body>
</html>
